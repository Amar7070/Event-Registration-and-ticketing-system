services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: smartevent_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smartevent
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306" # Only accessible on localhost for security
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartevent_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Laravel Service
  # Image is pulled from Docker Hub — built and pushed by the Jenkins pipeline
  backend:
    image: amarsahani/smartevent-backend:latest
    container_name: smartevent_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "SmartEvent"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:J6kU9hcXGMwL2hcJuTdfz8KfUzmFjgJq9rjk5M4zrAs=
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: smartevent
      DB_USERNAME: root
      DB_PASSWORD: root

      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    ports:
      - "8000:80"
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - smartevent_network

  # 3. Frontend React Service
  # Image is pulled from Docker Hub — built and pushed by the Jenkins pipeline
  frontend:
    image: amarsahani/smartevent-frontend:latest
    container_name: smartevent_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - smartevent_network

volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local

networks:
  smartevent_network:
    driver: bridge
